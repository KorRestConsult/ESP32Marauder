name: KOR Flipper S2 Bridge Build

on:
  workflow_dispatch:
  push:
    branches:
      - kor-bridge
    paths:
      - "esp32_marauder/**"
      - "User*.h"
      - ".github/workflows/kor_flipper_s2.yml"

permissions:
  contents: read

jobs:
  build_flipper_s2:
    name: Flipper Zero WiFi Dev Board ESP32-S2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core 2.0.11
        run: |
          "$GITHUB_WORKSPACE/bin/arduino-cli" core update-index
          "$GITHUB_WORKSPACE/bin/arduino-cli" core install esp32:esp32@2.0.11

      - name: Install ESP32Ping
        uses: actions/checkout@v4
        with:
          repository: marian-craciunescu/ESP32Ping
          ref: 1.6
          path: CustomESP32Ping
      - name: Install AsyncTCP
        uses: actions/checkout@v4
        with:
          repository: me-no-dev/AsyncTCP
          ref: master
          path: CustomAsyncTCP
      - name: Install MicroNMEA
        uses: actions/checkout@v4
        with:
          repository: stevemarple/MicroNMEA
          ref: v2.0.6
          path: CustomMicroNMEA
      - name: Install ESPAsyncWebServer
        uses: actions/checkout@v4
        with:
          repository: bigbrodude6119/ESPAsyncWebServer
          ref: master
          path: CustomESPAsyncWebServer
      - name: Install TFT_eSPI
        uses: actions/checkout@v4
        with:
          repository: Bodmer/TFT_eSPI
          ref: V2.5.34
          path: CustomTFT_eSPI
      - name: Install XPT2046_Touchscreen
        uses: actions/checkout@v4
        with:
          repository: PaulStoffregen/XPT2046_Touchscreen
          ref: v1.4
          path: CustomXPT2046_Touchscreen
      - name: Install lv_arduino
        uses: actions/checkout@v4
        with:
          repository: lvgl/lv_arduino
          ref: 3.0.0
          path: Customlv_arduino
      - name: Install JPEGDecoder
        uses: actions/checkout@v4
        with:
          repository: Bodmer/JPEGDecoder
          ref: 1.8.0
          path: CustomJPEGDecoder
      - name: Install NimBLE-Arduino
        uses: actions/checkout@v4
        with:
          repository: h2zero/NimBLE-Arduino
          ref: 1.3.5
          path: CustomNimBLE-Arduino
      - name: Install Adafruit_NeoPixel
        uses: actions/checkout@v4
        with:
          repository: adafruit/Adafruit_NeoPixel
          ref: 1.10.7
          path: CustomAdafruit_NeoPixel
      - name: Install ArduinoJson
        uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: v6.18.2
          path: CustomArduinoJson
      - name: Install LinkedList
        uses: actions/checkout@v4
        with:
          repository: ivanseidel/LinkedList
          ref: v1.3.3
          path: CustomLinkedList
      - name: Install EspSoftwareSerial
        uses: actions/checkout@v4
        with:
          repository: plerup/espsoftwareserial
          ref: 8.1.0
          path: CustomEspSoftwareSerial
      - name: Install Adafruit_BusIO
        uses: actions/checkout@v4
        with:
          repository: adafruit/Adafruit_BusIO
          ref: 1.15.0
          path: CustomAdafruit_BusIO
      - name: Install Adafruit_MAX1704X
        uses: actions/checkout@v4
        with:
          repository: adafruit/Adafruit_MAX1704X
          ref: 1.0.2
          path: CustomAdafruit_MAX1704X

      - name: Install arduinoWebSockets
        uses: actions/checkout@v4
        with:
          repository: Links2004/arduinoWebSockets
          ref: 2.7.2
          path: CustomarduinoWebSockets

      - name: Configure libraries
        run: |
          rm -f CustomTFT_eSPI/User_Setup_Select.h
          cp User*.h CustomTFT_eSPI/
          for i in $(find "$HOME/.arduino15/packages/esp32/hardware/esp32/" -name platform.txt); do
            sed -i 's/compiler.c.elf.libs.esp32s2=/compiler.c.elf.libs.esp32s2=-zmuldefs /' "$i"
          done

      - name: Compile KOR Bridge Marauder
        uses: ArminJo/arduino-test-compile@v3.2.1
        with:
          sketch-names: esp32_marauder.ino
          arduino-board-fqbn: esp32:esp32:esp32s2:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=enabled
          extra-arduino-cli-args: "--warnings none --build-property compiler.cpp.extra_flags='-DMARAUDER_KOR_BRIDGE'"
          arduino-platform: esp32:esp32@2.0.11
          platform-url: https://github.com/espressif/arduino-esp32/releases/download/2.0.11/package_esp32_dev_index.json

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp esp32_marauder/build/esp32.esp32.esp32s2/esp32_marauder.ino.bin artifact/kor-marauder-s2.bin
          cp esp32_marauder/build/esp32.esp32.esp32s2/*.bin artifact/
          shasum -a 256 artifact/* > artifact/SHA256SUMS.txt
          ls -lah artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kor-marauder-s2-bridge
          path: artifact/
          retention-days: 14
